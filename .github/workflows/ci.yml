name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # runner.temp is unavailable in workflow-level expressions. Each producing
  # job resolves this fresh run-specific name against RUNNER_TEMP below.
  RUSTWRIGHT_CI_OUTPUT: rustwright-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  msrv:
    name: Rust 1.85.0 / locked workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check all targets on the minimum Rust version
        run: cargo check --locked --workspace --all-targets

  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Reserve fresh CI artifact directory
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['RUSTWRIGHT_CI_OUTPUT']
          output.mkdir(parents=True, exist_ok=False)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'RUSTWRIGHT_CI_OUTPUT={output}\n')
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install Firefox for the shared HTTP tests
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '157.0.1'

      - name: Firefox version
        run: '"${{ steps.firefox.outputs.firefox-path }}" --version'

      - name: Diagnose and configure Linux Chrome sandbox
        timeout-minutes: 3
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 scripts/ci/chrome_linux_sandbox.py --output "$RUSTWRIGHT_CI_OUTPUT/workspace/linux-sandbox"

      - name: Test
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          RUSTWRIGHT_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          RUSTWRIGHT_RETRIES: '0'
          RUSTWRIGHT_HEADLESS: '1'
          RUSTWRIGHT_REQUIRE_BROWSERS: '1'
        run: cargo test --locked --workspace -- --test-threads=1

      - name: Retain Linux Chrome setup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-chrome-sandbox
          path: ${{ env.RUSTWRIGHT_CI_OUTPUT }}/workspace/linux-sandbox/
          if-no-files-found: error

  headed-versions-sites:
    name: Required headed / alternate versions / public sites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reserve fresh CI artifact directory
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['RUSTWRIGHT_CI_OUTPUT']
          output.mkdir(parents=True, exist_ok=False)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'RUSTWRIGHT_CI_OUTPUT={output}\n')
          PY
      - name: Install and check the isolated X11 display tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth x11-utils
          command -v Xvfb xvfb-run xauth xwininfo xprop
      - name: Install pinned current Chrome
        id: chrome-current
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '155.0.8059.39'
          install-dependencies: true
      - name: Diagnose and configure current Chrome sandbox
        timeout-minutes: 3
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome-current.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: ''
        run: python scripts/ci/chrome_linux_sandbox.py --output "$RUSTWRIGHT_CI_OUTPUT/extended/sandbox-current"
      - name: Install pinned current Firefox
        id: firefox-current
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '157.0.1'
      - name: Install pinned alternate Chrome
        id: chrome-previous
        uses: browser-actions/setup-chrome@v2
        with:
          # Exact available Linux build in the official CfT known-good index.
          chrome-version: '151.0.7922.138'
          install-dependencies: true
      - name: Diagnose and configure alternate Chrome sandbox
        timeout-minutes: 3
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome-previous.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: ''
        run: python scripts/ci/chrome_linux_sandbox.py --output "$RUSTWRIGHT_CI_OUTPUT/extended/sandbox-previous"
      - name: Install pinned Firefox ESR
        id: firefox-esr
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '153.4.0esr'
      - name: Required sequential native and public-site observations
        env:
          CHROME_CURRENT: ${{ steps.chrome-current.outputs.chrome-path }}
          FIREFOX_CURRENT: ${{ steps.firefox-current.outputs.firefox-path }}
          CHROME_PREVIOUS: ${{ steps.chrome-previous.outputs.chrome-path }}
          FIREFOX_ESR: ${{ steps.firefox-esr.outputs.firefox-path }}
        run: |
          xvfb-run -a --server-args '-screen 0 1280x1024x24 -nolisten tcp -noreset' \
            python scripts/ci/headed_sites.py \
              --chrome-current "$CHROME_CURRENT" --firefox-current "$FIREFOX_CURRENT" \
              --chrome-previous "$CHROME_PREVIOUS" --firefox-esr "$FIREFOX_ESR" \
              --sandbox-current "$RUSTWRIGHT_CI_OUTPUT/extended/sandbox-current/report.json" \
              --sandbox-previous "$RUSTWRIGHT_CI_OUTPUT/extended/sandbox-previous/report.json" \
              --output "$RUSTWRIGHT_CI_OUTPUT/extended"
      - name: Retain setup, native reports, window observations and site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headed-versions-sites
          path: ${{ env.RUSTWRIGHT_CI_OUTPUT }}/extended/
          if-no-files-found: warn

  browser-compat:
    name: Required Chrome + Firefox / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reserve fresh CI artifact directory
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['RUSTWRIGHT_CI_OUTPUT']
          output.mkdir(parents=True, exist_ok=False)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'RUSTWRIGHT_CI_OUTPUT={output}\n')
          PY
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '157.0.1'
      - name: Diagnose and configure Linux Chrome sandbox
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 scripts/ci/chrome_linux_sandbox.py --output "$RUSTWRIGHT_CI_OUTPUT/native/linux-sandbox"
      - name: Configure Windows Chrome sandbox permissions
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          $chromeDirectory = Split-Path -Parent $env:CHROME_EXECUTABLE
          $setupExecutable = Join-Path $chromeDirectory 'setup.exe'
          if (-not (Test-Path -LiteralPath $setupExecutable -PathType Leaf)) {
            throw "Chrome for Testing sandbox setup executable is missing"
          }
          # The Chrome-provided helper grants its installation capabilities
          # read/execute access. It returns installer status 78 on success.
          $setupArgument = '--configure-browser-in-directory="{0}"' -f $chromeDirectory
          $setupProcess = Start-Process -FilePath $setupExecutable -ArgumentList $setupArgument -Wait -PassThru
          Write-Host "Chrome sandbox setup exit code: $($setupProcess.ExitCode)"
          if ($setupProcess.ExitCode -ne 78) { throw "Chrome sandbox permission configuration failed" }
          & icacls.exe $env:CHROME_EXECUTABLE
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect Chrome executable permissions" }
      - name: Preserve the macOS Chrome application bundle
        id: chrome-macos
        if: runner.os == 'macOS'
        timeout-minutes: 3
        shell: bash
        env:
          CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re, subprocess, tempfile
          version = os.environ['CHROME_VERSION']
          if not re.fullmatch(r'\d+\.\d+\.\d+\.\d+', version):
              raise ValueError(f'Expected the exact installed Chrome version: {version!r}')
          platform = {'ARM64': 'mac-arm64', 'X64': 'mac-x64'}[os.environ['RUNNER_ARCH']]
          work = pathlib.Path(tempfile.mkdtemp(prefix='rustwright-chrome-', dir=os.environ['RUNNER_TEMP']))
          archive = work / 'chrome.zip'
          url = f'https://storage.googleapis.com/chrome-for-testing-public/{version}/{platform}/chrome-{platform}.zip'
          subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error', '--max-time', '120', '--output', str(archive), url], check=True)
          # Re-extract the same engine with its original .app and relative links.
          # Copying only .app contents into a toolcache breaks sandbox identity.
          subprocess.run(['ditto', '-x', '-k', str(archive), str(work)], check=True)
          bundle = work / f'chrome-{platform}' / 'Google Chrome for Testing.app'
          executable = bundle / 'Contents/MacOS/Google Chrome for Testing'
          if not executable.is_file():
              raise FileNotFoundError(executable)
          signature = subprocess.run(['codesign', '--verify', '--deep', '--strict', str(bundle)], capture_output=True, text=True)
          with (bundle / 'Contents/Info.plist').open('rb') as stream:
              identifier = plistlib.load(stream)['CFBundleIdentifier']
          with archive.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          links = {str(p.relative_to(bundle)): os.readlink(p) for p in bundle.glob('Contents/Frameworks/*.framework/Versions/Current') if p.is_symlink()}
          record = {'version': version, 'url': url, 'archive_sha256': digest, 'bundle_identifier': identifier, 'framework_links': links, 'executable': str(executable), 'signature_verification': {'exit_code': signature.returncode, 'stdout': signature.stdout, 'stderr': signature.stderr}}
          output = pathlib.Path(os.environ['RUSTWRIGHT_CI_OUTPUT']) / 'native/chrome-macos-setup.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(record, indent=2))
          subprocess.run([str(executable), '--version'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'chrome-path={executable}\n')
          PY
      - name: Record installed browser versions
        shell: bash
        env:
          CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          FIREFOX_VERSION: ${{ steps.firefox.outputs.firefox-version }}
        run: |
          echo "Chrome: $CHROME_VERSION"
          echo "Firefox: $FIREFOX_VERSION"
      - name: Required portable HTTP scenarios
        shell: bash
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome-macos.outputs.chrome-path || steps.chrome.outputs.chrome-path }}
          RUSTWRIGHT_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python scripts/ci/browser_checks.py --suite portable --output "$RUSTWRIGHT_CI_OUTPUT/native/portable"
      - name: Additional Linux HTTP regressions
        if: runner.os == 'Linux'
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          RUSTWRIGHT_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python scripts/ci/browser_checks.py --suite linux-extra --output "$RUSTWRIGHT_CI_OUTPUT/native/linux-extra"
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-http-${{ matrix.os }}
          path: ${{ env.RUSTWRIGHT_CI_OUTPUT }}/native/
          if-no-files-found: error

  package-consumer:
    name: Verified archives / stable + MSRV / native consumers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reserve fresh CI artifact directory
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['RUSTWRIGHT_CI_OUTPUT']
          output.mkdir(parents=True, exist_ok=False)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'RUSTWRIGHT_CI_OUTPUT={output}\n')
          PY
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '157.0.1'
      - name: Diagnose and configure Linux Chrome sandbox
        timeout-minutes: 3
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 scripts/ci/chrome_linux_sandbox.py --output "$RUSTWRIGHT_CI_OUTPUT/release-check/linux-sandbox"
      - name: Cache exact locked dependency archives
        run: cargo +stable fetch --locked
      - name: Check real packages and native consumers
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          RUSTWRIGHT_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python scripts/release_check.py --run-browser-tests --output "$RUSTWRIGHT_CI_OUTPUT/release-check"
      - name: Execute README entry points
        env:
          RUSTWRIGHT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          RUSTWRIGHT_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python scripts/release/readme_runtime.py --output "$RUSTWRIGHT_CI_OUTPUT/release-check"
      - name: Retain release verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            ${{ env.RUSTWRIGHT_CI_OUTPUT }}/release-check/*.log
            ${{ env.RUSTWRIGHT_CI_OUTPUT }}/release-check/*.json
            ${{ env.RUSTWRIGHT_CI_OUTPUT }}/release-check/package-target/*/package/*.crate
            ${{ env.RUSTWRIGHT_CI_OUTPUT }}/release-check/consumer/Cargo.lock
            ${{ env.RUSTWRIGHT_CI_OUTPUT }}/release-check/consumer/readme-snippets.json
            ${{ env.RUSTWRIGHT_CI_OUTPUT }}/release-check/consumer/firefox.png
            ${{ env.RUSTWRIGHT_CI_OUTPUT }}/release-check/native-screenshots/
            ${{ env.RUSTWRIGHT_CI_OUTPUT }}/release-check/linux-sandbox/
          if-no-files-found: error
