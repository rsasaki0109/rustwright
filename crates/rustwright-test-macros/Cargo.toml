[package]
name = "rustwright-test-macros"
description = "Procedural macros for the Rustwright test runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/rsasaki0109/rustwright"
keywords = ["test", "macro", "browser", "automation"]
categories = ["development-tools::testing"]
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
